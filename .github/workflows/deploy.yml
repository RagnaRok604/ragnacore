name: 🦅🚀🔥 Deploy app 🔥🚀🦅
on:
  push:
    branches:
      - main
jobs:
  compile_assets:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        uses: bahmutov/npm-install@v1
      - name: compile assets for production
        run: npm run build
      - name: Upload production-ready build files
        uses: actions/upload-artifact@v4
        with:
          name: ragna_assets
          path: ./dist
      - name: Download production-ready build files
        uses: actions/download-artifact@v4
        with:
          name: ragna_assets
          path: ./dist
      - name: Copy artifact to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_SERVER }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PASS_KEY }}
          source: "dist/,docker-compose.yml"
          target: ragna
  buildApp:
    name: Build app to server
    runs-on: ubuntu-latest
    needs: compile_assets
    steps:
      - name: install dependencies via composer
        uses: fifsky/ssh-action@master
        with:
          command: |
            cd ~/ragna
            docker stack rm ragna
            docker stack deploy -c docker-compose.yaml ragna
          host: ${{ secrets.SSH_SERVER }}
          user: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PASS_KEY }}
          #  pass: ${{ secrets.SSH_PASS_KEY }}
          args: '-tt -vvv'